  backend-3:
    image: hashicorp/http-echo:0.2.3
    container_name: backend-3
    command: ["-listen=:8080", "-text=Phan hoi tu Backend 3 (Port 8083)"]
    ports:
      - "8083:8080"
    restart: always

  backend-4:
    image: hashicorp/http-echo:0.2.3
    container_name: backend-4
    command: ["-listen=:8080", "-text=Phan hoi tu Backend 4 (Port 8084)"]
    ports:
      - "8084:8080"
    restart: always