version: '3.8'

services:
  backend-1:
    image: hashicorp/http-echo:0.2.3
    container_name: backend-1
    command: ["-listen=:8080", "-text=Phan hoi tu Backend 1 (Port 8081)"]
    ports:
      - "8081:8080"
    restart: always

  backend-2:
    image: hashicorp/http-echo:0.2.3
    container_name: backend-2
